[project]
name = "ai-chip-counts"
version = "0.1.0"
description = "Estimates of AI chip sales and owners, and the export of the published tables to S3."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyairtable>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
upload = ["boto3>=1.34"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
