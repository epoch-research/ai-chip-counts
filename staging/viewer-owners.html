<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chip Owners</title>
<style>
/* Styling for the staging copy of the AI chip explorers. Light theme only, to match the site. */
:root {
  --ink: #0b1f26;
  --ink-soft: #3e555e;
  --muted: #6b7b80;
  --line: #e3e4e4;
  --card: #ffffff;
  --ground: #f7f7f5;
  --pill: #f0f1ef;
  --accent: #00a5a6;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--ground);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-size: 14px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--pill); padding: 1px 4px; border-radius: 4px; }
[hidden] { display: none !important; }

header.site { display: flex; align-items: center; gap: 24px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
header.site .brand { font-weight: 600; color: var(--ink); text-decoration: none; }
header.site nav a { margin-right: 16px; color: var(--ink-soft); text-decoration: none; }
header.site nav a.current { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
.badge { font-size: 11px; font-weight: 600; background: #fff3d6; color: #8a5a00; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 1px; }

.explorer { max-width: 1440px; margin: 0 auto; padding: 20px 24px 32px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs, .view-switch { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button, .view-switch button {
  font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
  background: var(--pill); color: var(--ink-soft);
}
.tabs button.active { background: var(--ink); color: #fff; }
.view-switch { background: var(--pill); padding: 4px; border-radius: 12px; gap: 2px; }
.view-switch button { background: transparent; padding: 7px 14px; }
.view-switch button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.panel { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.explorer.sidebar-hidden .panel { grid-template-columns: minmax(0, 1fr); }
.explorer.sidebar-hidden .sidebar { display: none; }
.content { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }

.chart-head { display: flex; justify-content: space-between; align-items: center; }
.chart-title { font-size: 24px; margin: 0; font-weight: 600; }
.sidebar-toggle { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--ink-soft); }
.chart-subtitle { color: var(--ink-soft); font-size: 15px; margin: 6px 0 8px; font-weight: 500; cursor: help; }
.chart-row { display: flex; gap: 12px; align-items: flex-start; }
.chart-wrap { position: relative; flex: 1; min-width: 0; }
.chart { height: 480px; }
.legend { width: 220px; flex: none; max-height: 480px; overflow-y: auto; padding-top: 4px; }
.legend-group { margin-bottom: 12px; }
.legend-header { font-weight: 600; margin-bottom: 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink); }
.legend-incomplete { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; display: inline-block; opacity: .85; }
.swatch.hatch { background: repeating-linear-gradient(45deg, #d6d9d9 0 2px, #f4f5f5 2px 5px); border: 1px solid #aab1b1; opacity: 1; }
.footnote { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; line-height: 1.5; }
.empty { color: var(--muted); padding: 40px; text-align: center; }

.chart-svg { display: block; }
.chart-svg .axis text { fill: var(--muted); font-size: 12px; }
.chart-svg .axis path, .chart-svg .axis line { stroke: var(--line); }
.chart-svg .grid line { stroke: #eef0ef; }
.chart-svg .grid path { display: none; }
.chart-svg .trend { fill: none; stroke: #3e555e; stroke-width: 2; }
.chart-svg .trend.projected { stroke-dasharray: 5 4; }
.chart-svg .projection-bg { fill: #f3f4f2; }
.chart-svg .hover-col { fill: rgba(11, 31, 38, 0.05); pointer-events: none; }

.tooltip { position: absolute; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12); pointer-events: none; font-size: 12.5px; min-width: 200px; max-width: 360px; }
.tooltip .tip-head { font-weight: 600; margin-bottom: 6px; }
.tooltip table { border-collapse: collapse; width: 100%; }
.tooltip td { padding: 2px 0; vertical-align: top; }
.tooltip td:first-child { padding-right: 12px; }
.tooltip td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tooltip td .swatch { margin-right: 6px; vertical-align: -1px; }
.tooltip tr.total td { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 600; }
.tooltip .ci { color: var(--muted); }
.tooltip .tip-note { color: var(--muted); margin-top: 6px; font-size: 11.5px; }

.sidebar { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; position: sticky; top: 16px; }
.sidebar-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 8px; }
.sidebar-head h2 { font-size: 20px; margin: 0; font-weight: 600; }
.sidebar-head .reset { border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--ink-soft); }
.sidebar-group { border-bottom: 1px solid var(--line); padding: 8px 0 12px; }
.sidebar-group:last-child { border-bottom: 0; }
.sidebar-group.closed .control { display: none; }
.group-title { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; font: inherit; font-size: 17px; font-weight: 600; padding: 8px 0; cursor: pointer; color: var(--ink); }
.control { margin: 10px 0; }
.control.disabled { opacity: .45; }
.control-title { font-weight: 500; margin-bottom: 8px; font-size: 15px; }
.chips, .pills { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--ink); }
.chips button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.pills { background: var(--pill); border-radius: 10px; padding: 4px; display: inline-flex; gap: 2px; }
.pills button { font: inherit; font-size: 14px; border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; cursor: pointer; color: var(--ink-soft); }
.pills button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
button:disabled { cursor: not-allowed; opacity: .5; }
select { font: inherit; width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; }
.toggle input { display: none; }
.toggle .slider { width: 36px; height: 20px; border-radius: 999px; background: #d4d8d8; position: relative; flex: none; transition: background .15s; }
.toggle .slider::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle input:checked + .slider { background: var(--accent); }
.toggle input:checked + .slider::after { left: 19px; }
.info { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; align-items: center; justify-content: center; font-style: italic; font-weight: 700; cursor: help; vertical-align: 1px; }

.table-tools { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.table-tools input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 280px; }
.table-tools .count { color: var(--muted); }
.table-tools .download { margin-left: auto; color: var(--accent); }
.table-note { color: var(--muted); margin: 0 0 10px; }
.table-scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
.data-table { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
.data-table th { position: sticky; top: 0; background: #fafaf9; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-weight: 600; }
.data-table td { padding: 6px 10px; border-bottom: 1px solid #f0f1ef; }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.source { color: var(--muted); font-size: 12px; margin-top: 14px; }

/* Landing page */
.landing { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
.landing h1 { font-size: 28px; margin: 0 0 8px; }
.landing .lede { color: var(--ink-soft); max-width: 70ch; line-height: 1.55; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 24px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-decoration: none; color: var(--ink); display: block; }
.card:hover { border-color: var(--accent); }
.card h2 { margin: 0 0 6px; font-size: 19px; }
.card p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
.manifest { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.manifest th, .manifest td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #f0f1ef; font-size: 13px; }
.manifest td.num { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
  .panel { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .chart-row { flex-direction: column; }
  .legend { width: 100%; max-height: none; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .chart { height: 380px; }
}

/* Table view: inspect panel */
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { margin: 4px 0; padding-left: 18px; position: relative; font-size: 13px; }
.checks li::before { position: absolute; left: 0; }
/* check-* rather than ok/warn/info: .info is the tooltip icon class above. */
.checks .check-ok::before { content: "✓"; color: #1f7a3a; }
.checks .check-warn { color: #c43d2b; } .checks .check-warn::before { content: "!"; font-weight: 700; }
.checks .check-info { color: var(--ink-soft); } .checks .check-info::before { content: "·"; font-weight: 700; }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
.col-presets { margin-bottom: 8px; }
.col-presets button { font-size: 12.5px; padding: 4px 10px; }
.col-list { max-height: 52vh; overflow-y: auto; margin: 0 -4px; }
.col-row { display: flex; gap: 8px; align-items: flex-start; padding: 5px 4px; border-bottom: 1px solid #f0f1ef; cursor: pointer; font-size: 13px; }
.col-row:hover { background: #f6f8f8; }
.col-row input { margin-top: 3px; accent-color: var(--accent); }
.col-row b { font-weight: 500; display: block; }
.col-meta { display: block; color: var(--muted); font-size: 11.5px; }
.col-meta.blank { color: #c43d2b; }
.data-table tr.inc td { color: #8a6d1a; }
.data-table td.empty { background: #fff4f2; }

</style>
<script>

,Instinct MI308X,Instinct MI300X,Instinct MI325X,Instinct MI350X,Instinct MI355X\"\nMeta,United States of America,Compute owner,\nCoreWeave,United States of America,Compute owner,\nOracle,United States of America,Compute owner,\nOther (ex-Big 4 hyperscalers),,,\nCambricon,China,Chip designer,Siyuan 590\n","chip_type_map":"chip_type,designer,spec_chip,members,aliases\nA100,Nvidia,A100,A100,\nA800,Nvidia,A800,A800,\nH100/H200,Nvidia,H100,H100;H200,H100\nH800,Nvidia,H800,H800,\nH20,Nvidia,H20,H20,\nB200,Nvidia,B200,B200,\nB300,Nvidia,B300,B300,\nMI250X,AMD,Instinct MI250X,Instinct MI250X,Instinct MI250X\nMI300A,AMD,Instinct MI300A,Instinct MI300A,Instinct MI300A\nMI300X,AMD,Instinct MI300X,Instinct MI300X,Instinct MI300X\nMI308X,AMD,Instinct MI308X,Instinct MI308X,Instinct MI308X\nMI325X,AMD,Instinct MI325X,Instinct MI325X,Instinct MI325X\nMI350X,AMD,Instinct MI350X,Instinct MI350X,Instinct MI350X\nMI355X,AMD,Instinct MI355X,Instinct MI355X,Instinct MI355X\nTPU v4,Google,TPU v4,TPU v4,\nTPU v4i,Google,TPU v4i,TPU v4i,\nTPU v5e,Google,TPU v5e,TPU v5e,\nTPU v5p,Google,TPU v5p,TPU v5p,\nTPU v6e,Google,TPU v6e,TPU v6e,\nTPU v7,Google,TPU v7,TPU v7,\nTrainium1,Amazon,Trainium1,Trainium1,Trainium1/Inferentia\nTrainium2,Amazon,Trainium2,Trainium2,\nAscend 910B,Huawei,Ascend 910B,Ascend 910B,\nAscend 910C,Huawei,Ascend 910C,Ascend 910C,\nSiyuan 590,Cambricon,Siyuan 590,Siyuan 590,\n"};

<script>
/* Shared machinery for the AI Chip Sales and AI Chip Owners explorers.
 *
 * Reads the canonical tables from ../staging/ (the stand-in for Airtable) and renders
 * a stacked bar or area chart, its legend, a settings sidebar and a table view. The two
 * explorer scripts only decide which rows go into which series.
 */
/* global d3 */
'use strict';

const Hub = (() => {
  // ---------------------------------------------------------------- constants
  const STAGING = '../staging/';

  const COLORS = {
    teal: '#00A5A6', pink: '#E03D90', orange: '#FC6538', purple: '#6A3ECB', blue: '#0058DC',
    yellow: '#EA8D00', green: '#279E27', yellow2: '#E1C700', turquoise: '#3CC8C8', darkBlue: '#015D90',
    red: '#EA4831', lightGreen: '#5BC236', lightBlue: '#009AF1', lightPurple: '#B087F4',
    other: '#AAB1B1', trend: '#3E555E',
  };
  const DESIGNER_COLORS = {
    Nvidia: COLORS.teal, AMD: COLORS.orange, Google: COLORS.pink,
    Huawei: COLORS.purple, Amazon: COLORS.blue, Cambricon: COLORS.yellow,
  };
  const CATEGORICAL = [COLORS.teal, COLORS.pink, COLORS.orange, COLORS.purple, COLORS.blue, COLORS.yellow,
    COLORS.green, COLORS.yellow2, COLORS.turquoise, COLORS.darkBlue, COLORS.lightGreen, COLORS.lightBlue,
    COLORS.lightPurple];

  // Metric id -> canonical column stem, display labels, and a scale factor from the stored unit.
  const METRICS = {
    h100e: { stem: 'H100e', label: 'Compute capacity (H100e)', scale: 1,
      tooltip: 'Compute capacity in the equivalent number of Nvidia H100s, based on dense 8-bit operations per second.' },
    power: { stem: 'Power (MW)', label: 'Chip power (GW)', scale: 1 / 1000,
      tooltip: 'Total chip power in gigawatts, in terms of thermal design power. Excludes server and data center overheads.' },
    cost: { stem: 'Cost (USD)', label: 'Cost (USD)', scale: 1,
      tooltip: 'Estimated cost of the chips in US dollars, excluding servers, networking and facilities.' },
    units: { stem: 'Number of units', label: 'Number of units', scale: 1, tooltip: 'Number of chip units.' },
  };
  const STATS = { med: 'median', p5: '5th percentile', p95: '95th percentile' };

  // ---------------------------------------------------------------- data
  // Standalone builds embed every table as CSV text in window.HUB_DATA, so they open
  // from disk; served pages fetch the files from staging/.
  const EMBEDDED = window.HUB_DATA || null;
  const PATHS = { chip_type_map: '../pipeline/chip_type_map.csv' };
  const cache = {};
  function loadCsv(name) {
    if (!cache[name]) {
      cache[name] = EMBEDDED && EMBEDDED[name] != null
        ? Promise.resolve(d3.csvParse(EMBEDDED[name]))
        : d3.csv(PATHS[name] || `${STAGING}${name}.csv`);
    }
    return cache[name];
  }

  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }
  function endOfDay(date) {
    return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), 23, 59, 59, 999));
  }
  function quarterLabel(date) { return `${date.getUTCFullYear()} Q${Math.floor(date.getUTCMonth() / 3) + 1}`; }

  /* One staging row -> {designer, owner, chip, start, end, incomplete, m: {metric: {med, p5, p95}}}.
   * Quarterly rows span their quarter; cumulative rows span series start to end. */
  function parseRow(r) {
    const num = (v) => (v === '' || v == null ? null : +v);
    const m = {};
    for (const [id, spec] of Object.entries(METRICS)) {
      m[id] = {};
      for (const [s, word] of Object.entries(STATS)) {
        const v = num(r[`${spec.stem} (${word})`]);
        m[id][s] = v == null ? null : v * spec.scale;
      }
    }
    const start = parseDate(r['Start date'] || r['Series start date']);
    return {
      name: r.Name, designer: r.Designer, owner: r.Owner || null, chip: r['Chip type'] || null,
      start, end: endOfDay(parseDate(r['End date'])), incomplete: r.Incomplete === 'true', m, raw: r,
    };
  }

  async function loadTable(name) { return (await loadCsv(name)).map(parseRow); }

  async function loadChipTypes() {
    const rows = await loadCsv('chip_types');
    const map = await loadCsv('chip_type_map');
    const byName = new Map(rows.map((r) => [r.Name, r]));
    // Canonical results label -> release date of the chip that supplies its specs.
    const release = new Map();
    for (const r of map) {
      const spec = byName.get(r.spec_chip);
      release.set(r.chip_type, spec && spec['Release date'] ? parseDate(spec['Release date']) : new Date(0));
    }
    return { rows, release };
  }

  // ---------------------------------------------------------------- time
  function quarterIntervals(start, end) {
    const out = [];
    let y = start.getUTCFullYear(); let q = Math.floor(start.getUTCMonth() / 3);
    for (;;) {
      const from = new Date(Date.UTC(y, q * 3, 1));
      if (from >= end) break;
      const to = new Date(Date.UTC(y + (q === 3 ? 1 : 0), (q * 3 + 3) % 12, 1) - 1);
      out.push({ from, to, label: `${y} Q${q + 1}`, long: `${y} Q${q + 1} (${monthShort(from)} – ${monthShort(to)})` });
      q += 1; if (q > 3) { q = 0; y += 1; }
    }
    return out;
  }
  function yearIntervals(start, end) {
    const out = [];
    for (let y = start.getUTCFullYear(); ; y += 1) {
      const from = new Date(Date.UTC(y, 0, 1));
      if (from >= end) break;
      out.push({ from, to: new Date(Date.UTC(y + 1, 0, 1) - 1), label: `${y}`, long: `${y} (Jan – Dec)` });
    }
    return out;
  }
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function monthShort(d) { return MONTHS[d.getUTCMonth()]; }
  function inInterval(date, iv) { return date > iv.from && date <= iv.to; }

  // ---------------------------------------------------------------- formatting
  function formatNumber(v, sig = 3) {
    if (v == null || !isFinite(v)) return '–';
    const a = Math.abs(v);
    const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (const [k, s] of units) {
      if (a >= k) return `${+(v / k).toPrecision(sig)}${s}`;
    }
    if (a === 0) return '0';
    return a < 1 ? `${+v.toPrecision(2)}` : `${+v.toPrecision(sig)}`;
  }
  function formatAxis(v) { return formatNumber(v, 3); }
  function formatShare(v) { return v > 1 - 1e-6 ? '100%' : `${(v * 100).toFixed(1)}%`; }
  function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  // ---------------------------------------------------------------- palettes
  /* Shades of one base colour, perceptually spaced in Lab lightness, light to dark.
   * Mirrors the website's palette helper: make n + 4 shades and drop the extremes. */
  function sequentialPalette(base, n) {
    if (n <= 1) return [base];
    const lab = d3.lab(base);
    const count = n + 4;
    const range = 100 * (0.95 - 1 / count);
    const step = range / (count - 1);
    const lo = (100 - range) / 2;
    const levels = d3.range(count).map((i) => lo + i * step);
    let offset = Infinity;
    for (const l of levels) if (Math.abs(lab.l - l) < Math.abs(offset)) offset = lab.l - l;
    const colors = levels.map((l) => d3.lab(l + offset, lab.a, lab.b).formatHex()).reverse();
    return colors.slice(2, count - 2);
  }

  // ---------------------------------------------------------------- trend
  /* Least-squares exponential fit y = a·e^(bt) with a bootstrap interval on the growth rate. */
  function fitExponential(points) {
    const pts = points.filter((p) => p.y > 0);
    if (pts.length < 2) return null;
    const fit = (arr) => {
      const n = arr.length;
      let sx = 0; let sy = 0; let sxy = 0; let sxx = 0;
      for (const p of arr) { const ly = Math.log(p.y); sx += p.x; sy += ly; sxy += p.x * ly; sxx += p.x * p.x; }
      const den = n * sxx - sx * sx;
      if (Math.abs(den) < 1e-10) return null;
      const b = (n * sxy - sx * sy) / den;
      return { a: Math.exp((sy - b * sx) / n), b };
    };
    const best = fit(pts);
    if (!best) return null;
    const msYear = 365.25 * 864e5;
    const boots = [];
    if (pts.length >= 3) {
      let seed = 42;
      const rand = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
      for (let i = 0; i < 1000; i += 1) {
        const sample = pts.map(() => pts[Math.floor(rand() * pts.length)]);
        const f = fit(sample);
        if (f) boots.push(f.b * msYear);
      }
      boots.sort((x, y) => x - y);
    }
    const q = (p) => boots[Math.floor(p * (boots.length - 1))];
    const perYear = best.b * msYear;
    return { ...best, perYear, ci: boots.length ? [q(0.05), q(0.95)] : null };
  }

  /* Trend over per-period totals. In cumulative mode the fit is to the increments
   * between bars, since fitting stocks directly is biased upward. Trailing incomplete
   * periods are left out of the fit. Returns the line and summary stats. */
  function trendLine(totals, cumulative, projectUntil) {
    const trailing = (i) => totals[i].incomplete && !totals.slice(i + 1).some((t) => !t.incomplete);
    let endIdx = totals.length - 1;
    while (endIdx >= 0 && trailing(endIdx)) endIdx -= 1;
    if (endIdx < 1) return null;
    const step = totals[endIdx].x - totals[endIdx - 1].x;
    const future = [];
    if (projectUntil) for (let t = totals[endIdx].x + step; t <= projectUntil.getTime() + 1; t += step) future.push(t);

    if (cumulative) {
      const diffs = [];
      for (let i = 1; i <= endIdx; i += 1) {
        if (totals[i].y > totals[i - 1].y) diffs.push({ x: totals[i].x, y: totals[i].y - totals[i - 1].y });
      }
      const f = fitExponential(diffs);
      if (!f) return null;
      let acc = totals[0].y;
      const pts = [{ x: totals[0].x, y: acc }];
      for (let i = 1; i <= endIdx; i += 1) { acc += f.a * Math.exp(f.b * totals[i].x); pts.push({ x: totals[i].x, y: acc }); }
      for (const t of future) { acc += f.a * Math.exp(f.b * t); pts.push({ x: t, y: acc, projected: true }); }
      return { ...f, points: pts, title: 'Trend in quarterly additions', lastReal: totals[endIdx].x };
    }
    const f = fitExponential(totals.slice(0, endIdx + 1).map((t) => ({ x: t.x, y: t.y })));
    if (!f) return null;
    const xs = [...totals.slice(0, endIdx + 1).map((t) => t.x), ...future];
    return { ...f, points: xs.map((x) => ({ x, y: f.a * Math.exp(f.b * x), projected: x > totals[endIdx].x })),
      title: 'Trend', lastReal: totals[endIdx].x };
  }

  function trendSummary(t) {
    if (!t) return '';
    const x = (r) => Math.exp(r).toFixed(1);
    const dbl = (r) => (r > 0 ? ((Math.log(2) / r) * 12).toFixed(1) : '–');
    const ci = t.ci ? ` (90% CI ${x(t.ci[0])}–${x(t.ci[1])}×)` : '';
    return `${t.title}: ${x(t.perYear)}× per year${ci}, doubling every ${dbl(t.perYear)} months`;
  }

  // ---------------------------------------------------------------- chart
  let hatchCount = 0;

  /* Draw a stacked chart.
   * spec: {
   *   periods: [{label, long, x?}],   // one column per period (x: timestamp for trends)
   *   series:  [{id, label, color, values: [{value, low, high, incomplete}]}], bottom to top
   *   type: 'bar' | 'area', share, yLabel, yTooltip,
   *   trend: result of trendLine(), projected periods drawn after the real ones,
   *   showCi(seriesId) -> bool, xFormat(label) }
   */
  function drawChart(el, spec) {
    el.innerHTML = '';
    const width = Math.max(320, el.clientWidth);
    const height = Math.max(300, Math.min(560, el.clientHeight || 460));
    const margin = { top: 16, right: 16, bottom: 44, left: 64 };
    const svg = d3.select(el).append('svg').attr('width', width).attr('height', height).attr('class', 'chart-svg');
    const hatchId = `hatch-${hatchCount += 1}`;
    const pattern = svg.append('defs').append('pattern').attr('id', hatchId).attr('patternUnits', 'userSpaceOnUse')
      .attr('width', 6).attr('height', 6).attr('patternTransform', 'rotate(45)');
    pattern.append('rect').attr('width', 6).attr('height', 6).attr('fill', 'rgba(255,255,255,0.35)');
    pattern.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6).attr('stroke', 'rgba(255,255,255,0.85)').attr('stroke-width', 2.5);

    const projected = spec.trend ? spec.trend.points.filter((p) => p.projected) : [];
    const labels = [...spec.periods.map((p) => p.label), ...projected.map((p) => `${quarterLabel(new Date(p.x))}*`)];
    const x = d3.scaleBand().domain(labels).range([margin.left, width - margin.right]).padding(spec.type === 'bar' ? 0.18 : 0);

    // Stack: cumulative sums bottom to top per period.
    const stacks = spec.periods.map((_, i) => {
      let acc = 0;
      return spec.series.map((s) => { const v = Math.max(0, s.values[i]?.value || 0); const y0 = acc; acc += v; return [y0, acc]; });
    });
    const totals = stacks.map((st) => (st.length ? st[st.length - 1][1] : 0));
    const trendMax = spec.trend ? d3.max(spec.trend.points, (p) => p.y) : 0;
    const yMax = spec.share ? 1 : Math.max(d3.max(totals) || 1, trendMax || 0) * 1.05;
    const y = d3.scaleLinear().domain([0, yMax]).nice().range([height - margin.bottom, margin.top]);

    if (projected.length) {
      const first = x(labels[spec.periods.length]);
      svg.append('rect').attr('class', 'projection-bg').attr('x', first - (x.step() * x.padding()) / 2)
        .attr('y', margin.top).attr('width', width - margin.right - first + (x.step() * x.padding()) / 2)
        .attr('height', height - margin.bottom - margin.top);
    }
    svg.append('g').attr('class', 'grid').attr('transform', `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(6).tickSize(-(width - margin.left - margin.right)).tickFormat(''));
    svg.append('g').attr('class', 'axis').attr('transform', `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(6).tickFormat(spec.share ? (v) => `${Math.round(v * 100)}%` : formatAxis));
    const every = Math.ceil(labels.length / Math.max(2, Math.floor((width - margin.left) / 64)));
    svg.append('g').attr('class', 'axis x-axis').attr('transform', `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x).tickValues(labels.filter((_, i) => i % every === 0)).tickFormat(spec.xFormat || ((d) => d)));

    const plot = svg.append('g');
    if (spec.type === 'area') {
      const cx = (i) => x(labels[i]) + x.bandwidth() / 2;
      spec.series.forEach((s, si) => {
        const area = d3.area().x((_, i) => cx(i)).y0((_, i) => y(stacks[i][si][0])).y1((_, i) => y(stacks[i][si][1]));
        plot.append('path').attr('d', area(spec.periods)).attr('fill', s.color).attr('fill-opacity', 0.85);
      });
    } else {
      spec.series.forEach((s, si) => {
        spec.periods.forEach((p, i) => {
          const [y0, y1] = stacks[i][si];
          if (y1 - y0 <= 0) return;
          const attrs = { x: x(p.label), y: y(y1), width: x.bandwidth(), height: Math.max(0.5, y(y0) - y(y1)) };
          plot.append('rect').attr('x', attrs.x).attr('y', attrs.y).attr('width', attrs.width).attr('height', attrs.height)
            .attr('fill', s.color).attr('fill-opacity', 0.85);
          if (s.values[i]?.incomplete) {
            plot.append('rect').attr('x', attrs.x).attr('y', attrs.y).attr('width', attrs.width).attr('height', attrs.height)
              .attr('fill', `url(#${hatchId})`);
          }
        });
      });
    }

    if (spec.trend) {
      const px = (p) => {
        const idx = spec.periods.findIndex((q) => q.x === p.x);
        const lbl = idx >= 0 ? labels[idx] : `${quarterLabel(new Date(p.x))}*`;
        return x(lbl) + x.bandwidth() / 2;
      };
      const line = d3.line().x(px).y((p) => y(p.y)).curve(d3.curveMonotoneX);
      svg.append('path').attr('class', 'trend').attr('d', line(spec.trend.points.filter((p) => !p.projected)));
      const proj = spec.trend.points.filter((p) => p.projected || p.x === spec.trend.lastReal);
      if (proj.length > 1) svg.append('path').attr('class', 'trend projected').attr('d', line(proj));
    }

    // Hover: one column at a time.
    const tip = el.parentElement.querySelector('.tooltip') || el.parentElement.appendChild(Object.assign(document.createElement('div'), { className: 'tooltip' }));
    tip.hidden = true;
    const hover = svg.append('rect').attr('class', 'hover-col').attr('y', margin.top).attr('height', height - margin.bottom - margin.top).attr('width', x.step()).attr('opacity', 0);
    svg.append('rect').attr('x', margin.left).attr('y', margin.top).attr('width', width - margin.left - margin.right)
      .attr('height', height - margin.top - margin.bottom).attr('fill', 'transparent')
      .on('mousemove', (ev) => {
        const [mx] = d3.pointer(ev);
        const i = Math.floor((mx - margin.left) / x.step());
        if (i < 0 || i >= spec.periods.length) { tip.hidden = true; hover.attr('opacity', 0); return; }
        hover.attr('x', x(labels[i]) - (x.step() * x.padding()) / 2).attr('opacity', 1);
        tip.innerHTML = tooltipHtml(spec, i, totals[i]);
        tip.hidden = false;
        const box = el.getBoundingClientRect();
        const left = ev.clientX - box.left + 16;
        tip.style.left = `${Math.min(left, box.width - tip.offsetWidth - 8)}px`;
        tip.style.top = `${Math.max(0, ev.clientY - box.top - tip.offsetHeight / 2)}px`;
      })
      .on('mouseleave', () => { tip.hidden = true; hover.attr('opacity', 0); });
  }

  function tooltipHtml(spec, i, total) {
    const fmt = spec.share ? formatShare : (v) => formatNumber(v);
    const rows = [...spec.series].reverse().filter((s) => (s.values[i]?.value || 0) > 0).map((s) => {
      const v = s.values[i];
      const ci = !spec.share && spec.showCi && spec.showCi(s.id) && v.low != null && v.high != null
        ? ` <span class="ci">(${formatNumber(v.low)} – ${formatNumber(v.high)})<\/span>` : '';
      const inc = v.incomplete ? ' <span class="ci">incomplete<\/span>' : '';
      return `<tr><td><span class="swatch" style="background:${s.color}"><\/span>${escapeHtml(s.label)}<\/td><td>${fmt(v.value)}${ci}${inc}<\/td><\/tr>`;
    });
    const totalRow = spec.series.length > 1 && !spec.share ? `<tr class="total"><td>Total<\/td><td>${fmt(total)}<\/td><\/tr>` : '';
    const ciNote = spec.showCi && !spec.share ? '<div class="tip-note">Brackets show the 90% credible interval.<\/div>' : '';
    return `<div class="tip-head">${escapeHtml(spec.periods[i].long || spec.periods[i].label)}<\/div><table>${rows.join('')}${totalRow}<\/table>${ciNote}`;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /* Legend: groups [{header, items: [{id, label, color, tooltip?}]}], read top to bottom. */
  function drawLegend(el, groups, hasIncomplete) {
    el.innerHTML = '';
    for (const g of groups) {
      const div = document.createElement('div');
      div.className = 'legend-group';
      if (g.header) div.innerHTML = `<div class="legend-header">${escapeHtml(g.header)}<\/div>`;
      for (const it of g.items) {
        const row = document.createElement('div');
        row.className = 'legend-item';
        if (it.tooltip) row.title = it.tooltip;
        row.innerHTML = `<span class="swatch" style="background:${it.color}"><\/span>${escapeHtml(it.label)}`;
        div.appendChild(row);
      }
      el.appendChild(div);
    }
    if (hasIncomplete) {
      const row = document.createElement('div');
      row.className = 'legend-item legend-incomplete';
      row.title = 'The source data for this period does not cover all of it, or a value was carried forward.';
      row.innerHTML = '<span class="swatch hatch"><\/span>Incomplete data';
      el.appendChild(row);
    }
  }

  // ---------------------------------------------------------------- settings sidebar
  /* elements: [{type: 'group', title, open, elements: [...]}]; leaf types:
   *   chips | pills: {id, title, options: {value: label}, default}
   *   select: same, rendered as a dropdown
   *   toggle: {id, title, default, tooltip}
   *   range:  {id, title, min, max, step, default, format}
   * Every leaf may have enableIf(state) and showIf(state). */
  function buildSidebar(el, elements, state, onChange) {
    const leaves = [];
    el.innerHTML = '<div class="sidebar-head"><h2>Settings<\/h2><button class="reset" title="Reset settings">↺<\/button><\/div>';
    el.querySelector('.reset').onclick = () => {
      for (const l of leaves) state[l.id] = typeof l.default === 'function' ? l.default() : l.default;
      onChange();
    };
    for (const group of elements) {
      const sec = document.createElement('section');
      sec.className = 'sidebar-group';
      if (group.title) {
        const h = document.createElement('button');
        h.className = 'group-title';
        h.innerHTML = `<span>${group.title}<\/span><span class="sign">${group.open ? '−' : '+'}<\/span>`;
        h.onclick = () => { sec.classList.toggle('closed'); h.querySelector('.sign').textContent = sec.classList.contains('closed') ? '+' : '−'; };
        sec.appendChild(h);
        if (!group.open) sec.classList.add('closed');
      }
      for (const leaf of group.elements) {
        leaves.push(leaf);
        if (state[leaf.id] === undefined) state[leaf.id] = typeof leaf.default === 'function' ? leaf.default() : leaf.default;
        const wrap = document.createElement('div');
        wrap.className = `control control-${leaf.type}`;
        wrap.dataset.id = leaf.id;
        sec.appendChild(wrap);
      }
      el.appendChild(sec);
    }

    function render() {
      for (const leaf of leaves) {
        const wrap = el.querySelector(`.control[data-id="${leaf.id}"]`);
        const visible = leaf.showIf ? leaf.showIf(state) : true;
        const enabled = leaf.enableIf ? leaf.enableIf(state) : true;
        wrap.hidden = !visible;
        wrap.classList.toggle('disabled', !enabled);
        const tip = leaf.tooltip ? ` <span class="info" title="${escapeHtml(leaf.tooltip)}">i<\/span>` : '';
        if (leaf.type === 'toggle') {
          wrap.innerHTML = `<label class="toggle"><input type="checkbox" ${state[leaf.id] ? 'checked' : ''} ${enabled ? '' : 'disabled'}><span class="slider"><\/span><span>${leaf.title}${tip}<\/span><\/label>`;
          wrap.querySelector('input').onchange = (e) => { state[leaf.id] = e.target.checked; onChange(); };
        } else if (leaf.type === 'select') {
          const opts = typeof leaf.options === 'function' ? leaf.options(state) : leaf.options;
          wrap.innerHTML = `<div class="control-title">${leaf.title}${tip}<\/div><select ${enabled ? '' : 'disabled'}>${Object.entries(opts).map(([v, l]) => `<option value="${escapeHtml(v)}" ${state[leaf.id] === v ? 'selected' : ''}>${escapeHtml(l)}<\/option>`).join('')}<\/select>`;
          wrap.querySelector('select').onchange = (e) => { state[leaf.id] = e.target.value; onChange(); };
        } else if (leaf.type === 'range') {
          const lo = typeof leaf.min === 'function' ? leaf.min(state) : leaf.min;
          const hi = typeof leaf.max === 'function' ? leaf.max(state) : leaf.max;
          state[leaf.id] = Math.min(hi, Math.max(lo, state[leaf.id]));
          wrap.innerHTML = `<div class="control-title">${leaf.title}: <b>${leaf.format(state[leaf.id])}<\/b><\/div><input type="range" min="${lo}" max="${hi}" step="${leaf.step || 1}" value="${state[leaf.id]}" ${enabled ? '' : 'disabled'}>`;
          const input = wrap.querySelector('input');
          input.oninput = () => { wrap.querySelector('b').textContent = leaf.format(+input.value); };
          input.onchange = () => { state[leaf.id] = +input.value; onChange(); };
        } else {
          const opts = typeof leaf.options === 'function' ? leaf.options(state) : leaf.options;
          wrap.innerHTML = `<div class="control-title">${leaf.title}${tip}<\/div><div class="${leaf.type}">${Object.entries(opts).map(([v, l]) => {
            const off = leaf.disabledOptions && leaf.disabledOptions(state).includes(v);
            return `<button data-v="${escapeHtml(v)}" class="${state[leaf.id] === v ? 'active' : ''}" ${enabled && !off ? '' : 'disabled'}>${escapeHtml(l)}<\/button>`;
          }).join('')}<\/div>`;
          wrap.querySelectorAll('button').forEach((b) => { b.onclick = () => { state[leaf.id] = b.dataset.v; onChange(); }; });
        }
      }
    }
    return render;
  }

  // ---------------------------------------------------------------- table view
  const isNumCell = (v) => v !== '' && v != null && !isNaN(+v);

  /* One column's summary for the inspector: fill rate and range, or top values. */
  function columnSummary(rows, c) {
    const vals = rows.map((r) => r[c]);
    const filled = vals.filter((v) => v !== '' && v != null);
    const nums = filled.filter(isNumCell).map(Number).sort((a, b) => a - b);
    let detail;
    if (filled.length && nums.length === filled.length && !/date/i.test(c)) {
      detail = `${formatNumber(nums[0])} · ${formatNumber(nums[Math.floor(nums.length / 2)])} · ${formatNumber(nums[nums.length - 1])}`;
    } else {
      const counts = d3.rollups(filled, (l) => l.length, (v) => v).sort((a, b) => b[1] - a[1]);
      detail = `${counts.length} distinct: ${counts.slice(0, 2).map(([v, n]) => `${v.length > 18 ? `${v.slice(0, 18)}…` : v} (${n})`).join(', ')}`;
    }
    return { filled: filled.length, total: vals.length, detail };
  }

  /* Automatic sanity checks shown beside a table. */
  function tableChecks(rows) {
    const cols = rows.columns; const out = [];
    if (cols.includes('Name')) {
      const dup = rows.length - new Set(rows.map((r) => r.Name)).size;
      out.push(dup ? ['warn', `${dup} duplicate Name(s)`] : ['ok', 'Every Name is unique']);
    }
    for (const spec of Object.values(METRICS)) {
      const [lo, med, hi] = ['5th percentile', 'median', '95th percentile'].map((w) => `${spec.stem} (${w})`);
      if (!cols.includes(med)) continue;
      const bad = rows.filter((r) => [lo, med, hi].every((c) => isNumCell(r[c])) && !(+r[lo] <= +r[med] + 1e-9 && +r[med] <= +r[hi] + 1e-9));
      const blank = rows.filter((r) => !isNumCell(r[med])).length;
      out.push(bad.length ? ['warn', `${spec.stem}: ${bad.length} row(s) with percentiles out of order`] : ['ok', `${spec.stem}: 5th ≤ median ≤ 95th`]);
      if (blank) out.push([spec.stem.startsWith('Cost') ? 'info' : 'warn', `${spec.stem}: ${blank} row(s) with no median${spec.stem.startsWith('Cost') ? ' (chips with no price)' : ''}`]);
    }
    // Coverage per designer, from the End date of each row.
    if (cols.includes('End date') && cols.includes('Designer') && cols.includes('Name')) {
      const label = (s) => { const [y, m] = s.split('-').map(Number); return `Q${Math.floor((m - 1) / 3) + 1} ${y}`; };
      for (const [d, l] of d3.groups(rows, (r) => r.Designer)) {
        const ends = l.map((r) => r['End date']).sort();
        out.push(['info', `${d}: ${label(ends[0])} to ${label(ends[ends.length - 1])}`]);
      }
    }
    return out;
  }

  /* Table view. Columns can be hidden from the Inspect panel; the choice is kept per
   * table in state.hiddenColumns. */
  async function drawTable(el, side, csvName, note, state, onChange) {
    const rows = await loadCsv(csvName);
    const cols = rows.columns;
    state.hiddenColumns = state.hiddenColumns || {};
    const hidden = new Set(state.hiddenColumns[csvName] || []);
    let sortCol = null; let asc = true; let filter = '';
    const download = EMBEDDED
      ? URL.createObjectURL(new Blob([EMBEDDED[csvName]], { type: 'text/csv' }))
      : `${STAGING}${csvName}.csv`;
    el.innerHTML = `<div class="table-tools"><input type="search" placeholder="Filter rows…"><span class="count"><\/span><a class="download" href="${download}" download="${csvName}.csv">Download CSV<\/a><\/div>${note ? `<p class="table-note">${note}<\/p>` : ''}<div class="table-scroll"><table class="data-table"><thead><\/thead><tbody><\/tbody><\/table><\/div>`;
    const input = el.querySelector('input');
    input.oninput = () => { filter = input.value.toLowerCase(); render(); };

    const metricGroups = [
      ['All', () => []],
      ['Medians only', () => cols.filter((c) => /percentile\)$/.test(c))],
      ['Keys only', () => cols.filter((c) => /\((median|5th percentile|95th percentile)\)$/.test(c) || ['Notes', 'Source'].includes(c))],
    ];
    function drawSide() {
      side.innerHTML = `<div class="sidebar-head"><h2>Inspect<\/h2><\/div>
        <section class="sidebar-group"><div class="control-title">Checks<\/div><ul class="checks">${tableChecks(rows).map(([k, t]) => `<li class="check-${k}">${escapeHtml(t)}<\/li>`).join('')}<\/ul><\/section>
        <section class="sidebar-group"><div class="control-title">Columns <span class="hint">${cols.length - hidden.size} of ${cols.length} shown<\/span><\/div>
          <div class="chips col-presets">${metricGroups.map(([l], i) => `<button data-i="${i}">${l}<\/button>`).join('')}<\/div>
          <div class="col-list">${cols.map((c) => {
            const sm = columnSummary(rows, c);
            return `<label class="col-row"><input type="checkbox" data-c="${escapeHtml(c)}" ${hidden.has(c) ? '' : 'checked'}><span><b>${escapeHtml(c)}<\/b><span class="col-meta ${sm.filled < sm.total ? 'blank' : ''}">${sm.filled}/${sm.total} filled · ${escapeHtml(sm.detail)}<\/span><\/span><\/label>`;
          }).join('')}<\/div><\/section>`;
      side.querySelectorAll('.col-row input').forEach((cb) => {
        cb.onchange = () => { if (cb.checked) hidden.delete(cb.dataset.c); else hidden.add(cb.dataset.c); save(); };
      });
      side.querySelectorAll('.col-presets button').forEach((b) => {
        b.onclick = () => { hidden.clear(); metricGroups[+b.dataset.i][1]().forEach((c) => hidden.add(c)); save(); };
      });
    }
    function save() {
      state.hiddenColumns[csvName] = [...hidden];
      onChange();   // persists the choice in the URL
      drawSide(); render();
    }
    function render() {
      const shownCols = cols.filter((c) => !hidden.has(c));
      let shown = filter ? rows.filter((r) => cols.some((c) => String(r[c]).toLowerCase().includes(filter))) : rows.slice();
      if (sortCol) {
        const numeric = shown.every((r) => r[sortCol] === '' || isNumCell(r[sortCol]));
        shown.sort((a, b) => {
          const va = numeric ? (a[sortCol] === '' ? -Infinity : +a[sortCol]) : a[sortCol];
          const vb = numeric ? (b[sortCol] === '' ? -Infinity : +b[sortCol]) : b[sortCol];
          return (va < vb ? -1 : va > vb ? 1 : 0) * (asc ? 1 : -1);
        });
      }
      el.querySelector('.count').textContent = `${shown.length} of ${rows.length} rows`;
      el.querySelector('thead').innerHTML = `<tr>${shownCols.map((c) => `<th data-c="${escapeHtml(c)}">${escapeHtml(c)}${c === sortCol ? (asc ? ' ▲' : ' ▼') : ''}<\/th>`).join('')}<\/tr>`;
      el.querySelectorAll('th').forEach((th) => { th.onclick = () => { asc = sortCol === th.dataset.c ? !asc : true; sortCol = th.dataset.c; render(); }; });
      el.querySelector('tbody').innerHTML = shown.slice(0, 2000).map((r) => `<tr class="${r.Incomplete === 'true' ? 'inc' : ''}">${shownCols.map((c) => {
        const v = r[c];
        const isNum = isNumCell(v) && !/date|Name|Quarter|through/i.test(c);
        return `<td class="${isNum ? 'num' : ''}${v === '' ? ' empty' : ''}">${escapeHtml(isNum ? (+v).toLocaleString('en-US', { maximumFractionDigits: 3 }) : v)}<\/td>`;
      }).join('')}<\/tr>`).join('');
    }
    drawSide();
    render();
  }

  // ---------------------------------------------------------------- page shell
  /* Wire tabs, graph/table switch, sidebar and URL hash state around a render function. */
  function mountExplorer({ root, graphTabs, tableTabs, sidebar, state, renderGraph }) {
    const q = root.querySelector.bind(root);
    try {
      const saved = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}');
      Object.assign(state, saved);
    } catch (e) { /* ignore a malformed hash */ }
    state.view = state.view || 'graph';
    state.tab = state.tab || graphTabs[0].id;
    state.tableTab = state.tableTab || tableTabs[0].id;

    const renderSidebar = buildSidebar(q('.sidebar .settings'), sidebar, state, update);
    q('.sidebar-toggle').onclick = () => root.classList.toggle('sidebar-hidden');

    function drawTabs() {
      const tabs = state.view === 'graph' ? graphTabs : tableTabs;
      const active = state.view === 'graph' ? state.tab : state.tableTab;
      q('.tabs').innerHTML = tabs.map((t) => `<button data-id="${t.id}" class="${t.id === active ? 'active' : ''}">${t.label}<\/button>`).join('');
      q('.tabs').querySelectorAll('button').forEach((b) => {
        b.onclick = () => { if (state.view === 'graph') state.tab = b.dataset.id; else state.tableTab = b.dataset.id; update(); };
      });
      q('.view-switch').querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', b.dataset.view === state.view);
        b.onclick = () => { state.view = b.dataset.view; update(); };
      });
    }

    function saveState() { history.replaceState(null, '', `#${encodeURIComponent(JSON.stringify(state))}`); }
    async function update() {
      saveState();
      drawTabs();
      renderSidebar();
      const graph = state.view === 'graph';
      q('.graph-view').hidden = !graph;
      q('.table-view').hidden = graph;
      q('.sidebar .settings').hidden = !graph;
      q('.sidebar .inspect').hidden = graph;
      root.classList.toggle('table-mode', !graph);
      if (graph) await renderGraph(state);
      else {
        const t = tableTabs.find((x) => x.id === state.tableTab) || tableTabs[0];
        await drawTable(q('.table-view'), q('.sidebar .inspect'), t.csv, t.note, state, saveState);
      }
    }
    let raf = null;
    window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (state.view === 'graph') renderGraph(state); }); });
    update();
    return update;
  }

  return {
    COLORS, DESIGNER_COLORS, CATEGORICAL, METRICS, loadTable, loadCsv, loadChipTypes,
    quarterIntervals, yearIntervals, inInterval, quarterLabel, formatNumber, lowerFirst,
    sequentialPalette, trendLine, trendSummary, drawChart, drawLegend, mountExplorer, escapeHtml,
  };
})();

</script>
<script>
/* AI Chip Owners explorer: who holds the chips, over time or at one quarter.
 * Behaviour follows epoch-website-astro/legacy/vizs/ai-chip-owners/ai-chip-owners.ts,
 * rewritten against the canonical tables in staging/. */
/* global Hub */
'use strict';

(async () => {
  const [quarterly, cumulativeByChip, cumulativeByDesigner, chipTypes] = await Promise.all([
    Hub.loadTable('owners_quarterly_by_chip'),
    Hub.loadTable('owners_cumulative_by_chip'),
    Hub.loadTable('owners_cumulative_by_designer'),
    Hub.loadChipTypes(),
  ]);

  const SMUGGLED = 'China (smuggled)';
  const DESIGNER_LABEL = { Nvidia: 'Nvidia GPUs', AMD: 'AMD GPUs', Google: 'Google TPUs', Huawei: 'Huawei Ascend', Amazon: 'Amazon Trainium', Cambricon: 'Cambricon' };
  const DESIGNER_ORDER = ['Nvidia', 'AMD', 'Google', 'Huawei', 'Amazon', 'Cambricon'];
  const INDIVIDUAL = { Nvidia: ['H100/H200', 'B200', 'B300'], AMD: ['MI300X'], Google: ['TPU v5e', 'TPU v6e', 'TPU v7'],
    Amazon: ['Trainium1', 'Trainium2'], Huawei: ['Ascend 910B', 'Ascend 910C'] };
  const CHINA_TOOLTIP = '“China” means all mainland China customers. Nvidia and AMD figures only include official imports.';
  const release = (chip) => chipTypes.release.get(chip) || new Date(0);

  // Quarterly totals per owner and designer, summed from the by-chip rows. Their
  // intervals can't be summed, so they are left out.
  const quarterlyByDesigner = [...d3.rollup(quarterly, (list) => {
    const r = list[0];
    const m = {};
    for (const k of Object.keys(r.m)) m[k] = { med: d3.sum(list, (x) => x.m[k].med || 0), p5: null, p95: null };
    return { ...r, chip: null, m, incomplete: list.some((x) => x.incomplete) };
  }, (r) => `${r.owner}|${r.designer}|${r.end.getTime()}`).values()];

  // Owner colours, fixed by overall size so they don't shift between views.
  const size = d3.rollup([...cumulativeByDesigner, ...quarterlyByDesigner], (l) => d3.sum(l, (r) => r.m.h100e.med || 0), (r) => r.owner);
  const ownerColor = new Map();
  const palette = Hub.CATEGORICAL.filter((c) => c !== Hub.COLORS.red);
  let slot = 0;
  for (const [owner] of [...size].sort((a, b) => b[1] - a[1])) {
    ownerColor.set(owner, owner === 'Other' ? Hub.COLORS.other : owner === SMUGGLED ? Hub.COLORS.red : palette[slot++ % palette.length]);
  }
  const owners = [...new Set(cumulativeByDesigner.map((r) => r.owner))].filter((o) => o !== 'Other' && o !== SMUGGLED).sort();

  // The default timeline ends at the last quarter every designer covers completely.
  function lastCompleteEnd(rows) {
    const byDesigner = d3.group(rows, (r) => r.designer);
    return d3.min([...byDesigner.values()], (l) => d3.max(l.filter((r) => !r.incomplete), (r) => r.end));
  }
  const DEFAULT_START = new Date(Date.UTC(2024, 0, 1));
  const allQuarters = [...new Set(cumulativeByDesigner.map((r) => r.end.getTime()))].sort((a, b) => a - b).map((t) => new Date(t));
  const defaultEnd = lastCompleteEnd(cumulativeByDesigner);
  const snapshotQuarters = (s) => allQuarters.filter((d) => s.showAllData || (d >= DEFAULT_START && d <= defaultEnd));

  const now = new Date();
  const nowMonth = now.getUTCFullYear() * 12 + now.getUTCMonth();
  const monthLabel = (i) => `${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][i % 12]} ${Math.floor(i / 12)}`;

  const sidebar = [
    { type: 'group', open: true, elements: [
      { type: 'pills', id: 'mode', title: 'View', default: 'timeline', options: { timeline: 'Timeline', snapshot: 'Snapshot' } },
      { type: 'range', id: 'snapshotIndex', title: 'Quarter', default: () => Math.max(0, snapshotQuarters({}).length - 1), min: 0,
        max: (s) => Math.max(0, snapshotQuarters(s).length - 1), format: (i) => Hub.quarterLabel(snapshotQuarters(state)[i] || allQuarters[allQuarters.length - 1]),
        showIf: (s) => s.mode === 'snapshot' },
    ] },
    { type: 'group', open: true, elements: [
      { type: 'select', id: 'owner', title: 'Filter by chip owner', default: 'all', options: { all: 'All', ...Object.fromEntries(owners.map((o) => [o, o])) } },
      { type: 'chips', id: 'colorBy', title: 'Color by', default: 'none', options: { none: 'Chip owner', designer: 'Chip designer', chipType: 'Chip type' } },
    ] },
    { type: 'group', title: 'Display', open: true, elements: [
      { type: 'toggle', id: 'cumulative', title: 'Show cumulative', default: true, enableIf: (s) => s.mode === 'timeline',
        tooltip: 'When off, shows chips acquired in each quarter.' },
      { type: 'pills', id: 'proportion', title: 'Show data as', default: 'absolute', options: { absolute: 'Absolute', share: 'Percentage' } },
      { type: 'toggle', id: 'showSmuggled', title: 'Show speculative estimate of smuggled chips', default: false,
        enableIf: (s) => (s.mode === 'snapshot' || s.cumulative) && s.colorBy !== 'chipType' },
      { type: 'toggle', id: 'showTrend', title: 'Show trend', default: false, enableIf: (s) => s.mode === 'timeline' && s.proportion !== 'share' },
      { type: 'toggle', id: 'projectTrend', title: 'Project trend', default: false,
        tooltip: 'Extend the fitted trend, assuming growth continues at the historical rate. An extrapolation, not a forecast.',
        showIf: (s) => s.showTrend && s.mode === 'timeline' && s.proportion !== 'share' },
      { type: 'range', id: 'projectUntil', title: 'Project until end of', default: nowMonth + 12, min: nowMonth + 1, max: nowMonth + 60,
        format: monthLabel, showIf: (s) => s.showTrend && s.projectTrend && s.mode === 'timeline' },
    ] },
    { type: 'group', title: 'Additional settings', open: false, elements: [
      { type: 'toggle', id: 'showAllData', title: 'Show incomplete historic data', default: false },
    ] },
  ];
  const state = {};

  const graphTabs = ['h100e', 'power', 'units'].map((id) => ({ id, label: Hub.METRICS[id].label }));
  const tableTabs = [
    { id: 'd', label: 'Cumulative by designer', csv: 'owners_cumulative_by_designer' },
    { id: 'c', label: 'Cumulative by chip', csv: 'owners_cumulative_by_chip' },
    { id: 'q', label: 'Quarterly by chip', csv: 'owners_quarterly_by_chip' },
    { id: 't', label: 'Chip types', csv: 'chip_types' },
  ];
  const root = document.querySelector('.explorer');

  /* Chip key for the chip-type view: a chip on the short list, or its designer's pool.
   * A designer with four or fewer chip types in context shows them all. */
  function chipGrouper(rows, scopeKey) {
    const counts = d3.rollup(rows, (l) => new Set(l.map((r) => r.chip)).size, scopeKey);
    return (r) => ((INDIVIDUAL[r.designer] || []).includes(r.chip) || (counts.get(scopeKey(r)) || 0) <= 4
      ? r.chip : `Other ${DESIGNER_LABEL[r.designer] || r.designer}`);
  }

  function categorize(rows, s, groupAll) {
    const cat = new Map(); // id -> {id, label, group, color}
    let keyOf;
    if (groupAll && s.colorBy === 'none') {
      keyOf = (r) => r.owner;
      for (const r of rows) cat.set(r.owner, { id: r.owner, label: r.owner, group: '', color: ownerColor.get(r.owner), tooltip: r.owner === 'China' ? CHINA_TOOLTIP : null });
    } else if (groupAll && s.colorBy === 'designer') {
      keyOf = (r) => `${r.owner}__${r.designer}`;
      for (const r of rows) cat.set(keyOf(r), { id: keyOf(r), label: DESIGNER_LABEL[r.designer] || r.designer, group: r.owner, designer: r.designer });
    } else if (groupAll) {
      const chipKey = chipGrouper(rows, (r) => `${r.owner}|${r.designer}`);
      keyOf = (r) => `${r.owner}__${chipKey(r)}`;
      for (const r of rows) cat.set(keyOf(r), { id: keyOf(r), label: chipKey(r), group: r.owner, designer: r.designer, chip: r.chip });
    } else if (s.colorBy === 'none') {
      keyOf = (r) => r.owner;
      for (const r of rows) cat.set(r.owner, { id: r.owner, label: r.owner, group: '', color: ownerColor.get(r.owner) });
    } else if (s.colorBy === 'designer') {
      keyOf = (r) => r.designer;
      for (const r of rows) cat.set(r.designer, { id: r.designer, label: DESIGNER_LABEL[r.designer] || r.designer, group: '', color: Hub.DESIGNER_COLORS[r.designer] });
    } else {
      const chipKey = chipGrouper(rows, (r) => r.designer);
      keyOf = (r) => `${r.designer}__${chipKey(r)}`;
      for (const r of rows) cat.set(keyOf(r), { id: keyOf(r), label: chipKey(r), group: DESIGNER_LABEL[r.designer] || r.designer, designer: r.designer, chip: r.chip, designerGroup: true });
    }
    return { cat, keyOf };
  }

  /* Colour grouped categories: shades of the group's base colour, newest chip lightest,
   * pooled "Other …" chips darkest. Returns legend groups ordered top to bottom. */
  function colorGroups(cats, groupBase) {
    const byGroup = d3.group(cats, (c) => c.group);
    const out = [];
    for (const [group, list] of byGroup) {
      list.sort((a, b) => {
        const ao = a.label.startsWith('Other '); const bo = b.label.startsWith('Other ');
        if (ao !== bo) return ao ? 1 : -1;
        const di = DESIGNER_ORDER.indexOf(a.designer) - DESIGNER_ORDER.indexOf(b.designer);
        return di || (a.chip && b.chip ? release(b.chip) - release(a.chip) : 0);
      });
      const pal = Hub.sequentialPalette(groupBase(group, list[0]), list.length);
      list.forEach((c, i) => { c.color = c.color && !group ? c.color : pal[i]; });
      out.push({ header: group, items: list });
    }
    return out;
  }

  /* Order stacks bottom to top: Other first, then the categories present in the most
   * bars, keeping groups together. Smuggled chips sit directly on top of China. */
  function stackOrder(groups, valuesOf) {
    const ubiq = (items) => ({ n: d3.max(items, (c) => valuesOf(c).filter((v) => v.value > 0).length) || 0,
      t: d3.sum(items, (c) => d3.sum(valuesOf(c), (v) => v.value)) });
    const isOther = (g) => g.header === 'Other' || g.items.every((c) => c.label === 'Other');
    let sorted = [...groups].sort((a, b) => {
      if (isOther(a) !== isOther(b)) return isOther(a) ? -1 : 1;
      const ua = ubiq(a.items); const ub = ubiq(b.items);
      return ub.n - ua.n || ub.t - ua.t;
    });
    const flat = sorted.length === 1 && !sorted[0].header;
    if (flat) {
      let items = [...sorted[0].items].sort((a, b) => {
        if ((a.label === 'Other') !== (b.label === 'Other')) return a.label === 'Other' ? -1 : 1;
        const ua = ubiq([a]); const ub = ubiq([b]);
        return ub.n - ua.n || ub.t - ua.t;
      });
      const sm = items.findIndex((c) => c.label === SMUGGLED);
      if (sm >= 0) { const [x] = items.splice(sm, 1); items.splice(items.findIndex((c) => c.label === 'China') + 1, 0, x); }
      return { stack: items, legend: [{ header: '', items: [...items].reverse() }] };
    }
    const sm = sorted.findIndex((g) => g.header === SMUGGLED);
    if (sm >= 0) { const [x] = sorted.splice(sm, 1); sorted.splice(sorted.findIndex((g) => g.header === 'China') + 1, 0, x); }
    return { stack: sorted.flatMap((g) => [...g.items].reverse()), legend: [...sorted].reverse() };
  }

  function subtractSmuggled(values, catIdOther, catIdSmuggled) {
    const o = values.get(catIdOther); const s = values.get(catIdSmuggled);
    if (!o || !s) return;
    o.forEach((v, i) => { v.value = Math.max(0, v.value - (s[i]?.value || 0)); v.low = null; v.high = null; });
  }

  function renderTimeline(s) {
    const metric = s.tab;
    const cumulative = s.cumulative;
    const smuggled = s.showSmuggled && cumulative && s.colorBy !== 'chipType';
    const chipRows = cumulative ? cumulativeByChip : quarterly;
    const designerRows = cumulative ? cumulativeByDesigner : quarterlyByDesigner;
    const matches = (r) => r.owner === s.owner || (smuggled && s.owner === 'China' && r.owner === SMUGGLED);
    let rows;
    if (s.owner === 'all') rows = s.colorBy === 'chipType' ? chipRows : designerRows;
    else if (s.colorBy === 'chipType') rows = chipRows.filter(matches).length ? chipRows.filter(matches) : designerRows.filter(matches);
    else rows = designerRows.filter(matches);
    if (!smuggled) rows = rows.filter((r) => r.owner !== SMUGGLED);
    if (!rows.length) return emptyChart();

    const minStart = d3.min(rows, (r) => r.start);
    let maxEnd = d3.max(rows, (r) => r.end);
    // By default, stop at the last quarter that every designer in view covers completely.
    const complete = lastCompleteEnd(rows);
    if (!s.showAllData && s.owner === 'all' && complete && complete < maxEnd) maxEnd = complete;
    let intervals = Hub.quarterIntervals(minStart, maxEnd);
    const groupAll = s.owner === 'all' || rows.some((r) => r.owner === SMUGGLED);
    const { cat, keyOf } = categorize(rows, s, groupAll);

    // Forward-fill each owner × designer × chip series in cumulative mode, then sum into categories.
    const values = new Map([...cat.keys()].map((k) => [k, intervals.map(() => ({ value: 0, low: 0, high: 0, n: 0, incomplete: false }))]));
    for (const list of d3.group(rows, (r) => `${r.owner}|${r.designer}|${r.chip}`).values()) {
      const target = values.get(keyOf(list[0]));
      let last = null;
      intervals.forEach((iv, i) => {
        const inside = list.filter((r) => Hub.inInterval(r.end, iv));
        const t = target[i];
        if (inside.length) {
          const r = inside[inside.length - 1];
          last = r;
          t.value += r.m[metric].med || 0; t.low += r.m[metric].p5 || 0; t.high += r.m[metric].p95 || 0; t.n += 1;
          t.incomplete = t.incomplete || r.incomplete;
        } else if (cumulative && last) {
          t.value += last.m[metric].med || 0; t.n += 1; t.incomplete = true;
        }
      });
    }
    for (const arr of values.values()) for (const v of arr) if (v.n !== 1) { v.low = null; v.high = null; }
    if (smuggled && s.owner === 'all') {
      if (s.colorBy === 'none') subtractSmuggled(values, 'Other', SMUGGLED);
      else subtractSmuggled(values, 'Other__Nvidia', `${SMUGGLED}__Nvidia`);
    }

    let keep = intervals.map((_, i) => i);
    if (!s.showAllData && s.owner === 'all') keep = keep.filter((i) => intervals[i].from >= DEFAULT_START);
    intervals = keep.map((i) => intervals[i]);
    for (const [k, arr] of values) values.set(k, keep.map((i) => arr[i]));

    const cats = [...cat.values()].filter((c) => d3.sum(values.get(c.id), (v) => v.value) > 0);
    const legendGroups = colorGroups(cats, (group, first) => (groupAll ? ownerColor.get(group) : Hub.DESIGNER_COLORS[first.designer]) || '#999');
    const { stack, legend } = stackOrder(legendGroups, (c) => values.get(c.id));

    const share = s.proportion === 'share';
    if (share) intervals.forEach((_, i) => { const t = d3.sum(stack, (c) => values.get(c.id)[i].value); for (const c of stack) { const v = values.get(c.id)[i]; v.value = t > 0 ? v.value / t : 0; } });
    const periods = intervals.map((iv) => ({ label: iv.label, long: iv.long, x: iv.to.getTime() }));
    let trend = null;
    if (s.showTrend && !share) {
      const totals = periods.map((p, i) => ({ x: p.x, y: d3.sum(stack, (c) => values.get(c.id)[i].value), incomplete: stack.some((c) => values.get(c.id)[i].incomplete) }));
      const until = s.projectTrend ? new Date(Date.UTC(Math.floor(s.projectUntil / 12), (s.projectUntil % 12) + 1, 1) - 1) : null;
      trend = Hub.trendLine(totals, cumulative, until);
    }
    const m = Hub.METRICS[metric];
    setTitles(s, cumulative ? `Cumulative ${Hub.lowerFirst(m.label)}` : m.label, share, m.tooltip);
    const showCi = s.colorBy !== 'none' || smuggled ? (id) => s.colorBy !== 'none' || id === SMUGGLED : null;
    Hub.drawChart(root.querySelector('.chart'), {
      periods, series: stack.map((c) => ({ id: c.id, label: groupAll && c.group ? `${c.group}: ${c.label}` : c.label, color: c.color, values: values.get(c.id) })),
      type: 'bar', share, trend, showCi, xFormat: (d) => (d.endsWith('*') || d.endsWith('Q1') ? d : d.slice(5)),
    });
    Hub.drawLegend(root.querySelector('.legend'), legend.map((g) => ({ header: g.header, items: g.items })), stack.some((c) => values.get(c.id).some((v) => v.incomplete)));
    footnote(cumulative, trend);
  }

  function renderSnapshot(s) {
    const metric = s.tab;
    const quarters = snapshotQuarters(s);
    const idx = Math.min(s.snapshotIndex ?? quarters.length - 1, quarters.length - 1);
    const q = quarters[idx];
    const smuggled = s.showSmuggled && s.colorBy !== 'chipType';
    const inQuarter = (r) => r.end.getTime() === q.getTime();
    const matches = (r) => s.owner === 'all' || r.owner === s.owner || (smuggled && s.owner === 'China' && r.owner === SMUGGLED);
    const keepOwner = (r) => matches(r) && (smuggled || r.owner !== SMUGGLED);
    const chipRows = cumulativeByChip.filter((r) => inQuarter(r) && keepOwner(r));
    const designerRows = cumulativeByDesigner.filter((r) => inQuarter(r) && keepOwner(r));
    const ownersWithChips = new Set(chipRows.map((r) => r.owner));

    // owner -> key -> {value, low, high, n, designer, label, chip}
    const breakdown = new Map();
    const add = (owner, key, r, extra) => {
      if (!breakdown.has(owner)) breakdown.set(owner, new Map());
      const b = breakdown.get(owner);
      const e = b.get(key) || { value: 0, low: 0, high: 0, n: 0, designer: r.designer, ...extra };
      e.value += r.m[metric].med || 0; e.low += r.m[metric].p5 || 0; e.high += r.m[metric].p95 || 0; e.n += 1;
      b.set(key, e);
    };
    if (s.colorBy === 'none') designerRows.forEach((r) => add(r.owner, r.owner, r, { label: r.owner }));
    else if (s.colorBy === 'designer') designerRows.forEach((r) => add(r.owner, r.designer, r, { label: DESIGNER_LABEL[r.designer] || r.designer }));
    else {
      const chipKey = chipGrouper(chipRows, (r) => `${r.owner}|${r.designer}`);
      chipRows.forEach((r) => add(r.owner, `${r.designer}__${chipKey(r)}`, r, { label: chipKey(r), chip: r.chip }));
      designerRows.filter((r) => !ownersWithChips.has(r.owner)).forEach((r) => add(r.owner, `${r.designer}__${DESIGNER_LABEL[r.designer]}`, r, { label: DESIGNER_LABEL[r.designer] || r.designer }));
    }
    if (smuggled && s.owner === 'all' && breakdown.has('Other') && breakdown.has(SMUGGLED)) {
      const key = s.colorBy === 'none' ? 'Other' : 'Nvidia';
      const smKey = s.colorBy === 'none' ? SMUGGLED : 'Nvidia';
      const o = breakdown.get('Other').get(key); const sm = breakdown.get(SMUGGLED).get(smKey);
      if (o && sm) { o.value = Math.max(0, o.value - sm.value); o.n = 2; }
    }
    if (!breakdown.size) return emptyChart();

    const ownerList = [...breakdown.entries()].map(([owner, b]) => ({ owner, total: d3.sum([...b.values()], (e) => e.value) }))
      .sort((a, b) => (a.owner === 'Other') - (b.owner === 'Other') || b.total - a.total).map((e) => e.owner);
    const keys = new Map();
    for (const b of breakdown.values()) for (const [k, e] of b) if (!keys.has(k)) keys.set(k, e);
    const share = s.proportion === 'share';
    const ownerTotal = new Map(ownerList.map((o) => [o, d3.sum([...breakdown.get(o).values()], (e) => e.value)]));
    const series = [...keys].map(([key, e]) => ({
      id: key, label: e.label, designer: e.designer, chip: e.chip,
      values: ownerList.map((o) => {
        const x = breakdown.get(o).get(key);
        if (!x) return { value: 0 };
        return { value: share ? x.value / (ownerTotal.get(o) || 1) : x.value, low: x.n === 1 ? x.low : null, high: x.n === 1 ? x.high : null };
      }),
    }));
    let legend; let stack;
    if (s.colorBy === 'none') {
      series.forEach((sr) => { sr.color = ownerColor.get(sr.id); });
      stack = [...series].sort((a, b) => ownerList.indexOf(a.id) - ownerList.indexOf(b.id));
      legend = [{ header: '', items: stack.map((c) => ({ ...c, tooltip: c.id === 'China' ? CHINA_TOOLTIP : null })) }];
    } else {
      const byDesigner = d3.group(series, (sr) => sr.designer);
      const order = [...byDesigner.entries()].sort((a, b) => d3.sum(b[1], (x) => d3.sum(x.values, (v) => v.value)) - d3.sum(a[1], (x) => d3.sum(x.values, (v) => v.value)));
      legend = order.map(([designer, list]) => {
        list.sort((a, b) => (a.label.startsWith('Other ')) - (b.label.startsWith('Other ')) || (a.chip && b.chip ? release(b.chip) - release(a.chip) : 0));
        const pal = Hub.sequentialPalette(Hub.DESIGNER_COLORS[designer] || '#999', list.length);
        list.forEach((c, i) => { c.color = pal[i]; });
        return { header: s.colorBy === 'designer' ? '' : DESIGNER_LABEL[designer] || designer, items: list };
      });
      if (s.colorBy === 'designer') legend = [{ header: 'Chip family', items: legend.flatMap((g) => g.items) }];
      stack = [...legend].reverse().flatMap((g) => [...g.items].reverse());
    }
    const m = Hub.METRICS[metric];
    setTitles(s, `Cumulative ${Hub.lowerFirst(m.label)} at the end of ${Hub.quarterLabel(q)}`, share, m.tooltip);
    Hub.drawChart(root.querySelector('.chart'), {
      periods: ownerList.map((o) => ({ label: o, long: `${o}, ${Hub.quarterLabel(q)}` })),
      series: stack, type: 'bar', share, showCi: s.colorBy !== 'none' ? () => true : (id) => id === SMUGGLED,
    });
    Hub.drawLegend(root.querySelector('.legend'), legend, false);
    footnote(true, null);
  }

  function setTitles(s, subtitle, share, tip) {
    const who = s.owner !== 'all' ? `${s.owner} chip ownership` : 'AI chip ownership';
    root.querySelector('.chart-title').textContent = s.mode === 'snapshot' ? who : `${who} over time`;
    const el = root.querySelector('.chart-subtitle');
    el.textContent = share ? `Share of ${Hub.lowerFirst(subtitle.replace(/\s*\(.*?\)/, ''))}` : subtitle;
    el.title = tip;
  }

  function footnote(cumulative, trend) {
    const notes = [];
    if (cumulative) {
      const starts = d3.rollup(cumulativeByDesigner.filter((r) => r.owner !== SMUGGLED), (l) => Hub.quarterLabel(d3.min(l, (r) => r.start)), (r) => r.designer);
      const byStart = d3.groups([...starts], ([, q]) => q).sort((a, b) => (a[0] < b[0] ? -1 : 1));
      notes.push(`Cumulative totals count chips from each designer's first modelled quarter: ${byStart.map(([q, ds]) => `${ds.map(([d]) => d).join(', ')} from ${q}`).join('; ')}.`);
    }
    if (trend) notes.push(`${Hub.trendSummary(trend)}.`);
    root.querySelector('.footnote').textContent = notes.join(' ');
  }

  function emptyChart() {
    root.querySelector('.chart').innerHTML = '<p class="empty">No data for this selection.<\/p>';
    root.querySelector('.legend').innerHTML = '';
    root.querySelector('.footnote').textContent = '';
  }

  Hub.mountExplorer({ root, graphTabs, tableTabs, sidebar, state, renderGraph: (s) => (s.mode === 'snapshot' ? renderSnapshot(s) : renderTimeline(s)) });
})();

</script>
</body>
</html>
